name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinning: this said 1.23 while the
          # module required 1.24, and only worked because Go silently downloads
          # a newer toolchain — so the pin described nothing.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # The race detector earns its minutes here: Fleet runs session brokering,
      # monitoring, scans, playbook runs and the reconciler on background
      # goroutines, and a race between them is the kind of bug that surfaces
      # once in production and never locally.
      - run: go test -race -count=1 -timeout 25m ./...

  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # help-content.ts is generated from repo-root docs/ and git-ignored;
      # it must exist before the standalone typecheck below.
      - run: npm run build-help && npm run build-guac-player
      - run: npx tsc -b
      # The suite existed and had never run here: the job typechecked and built,
      # so a failing test could be merged without anything noticing.
      - run: npx vitest run
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fleet-backend:ci ./backend
      - name: Build frontend image
        # The frontend Dockerfile requires the repo root as build context
        # (it COPYs frontend/ and docs/ — see the note in frontend/Dockerfile).
        run: docker build -t fleet-frontend:ci -f frontend/Dockerfile .
