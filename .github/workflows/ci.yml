name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # help-content.ts is generated from repo-root docs/ and git-ignored;
      # it must exist before the standalone typecheck below.
      - run: npm run build-help && npm run build-guac-player
      - run: npx tsc -b
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fleet-backend:ci ./backend
      - name: Build frontend image
        # The frontend Dockerfile requires the repo root as build context
        # (it COPYs frontend/ and docs/ — see the note in frontend/Dockerfile).
        run: docker build -t fleet-frontend:ci -f frontend/Dockerfile .
