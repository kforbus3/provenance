name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Read from go.mod rather than pinning: this said 1.23 while the
          # module required 1.24, and only worked because Go silently downloads
          # a newer toolchain — so the pin described nothing.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # The race detector earns its minutes here: Provenance runs session brokering,
      # monitoring, scans, playbook runs and the reconciler on background
      # goroutines, and a race between them is the kind of bug that surfaces
      # once in production and never locally.
      - run: go test -race -count=1 -timeout 25m ./...

  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # help-content.ts is generated from repo-root docs/ and git-ignored;
      # it must exist before the standalone typecheck below.
      - run: npm run build-help && npm run build-guac-player
      - run: npx tsc -b
      # The suite existed and had never run here: the job typechecked and built,
      # so a failing test could be merged without anything noticing.
      - run: npx vitest run
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build -t prov-backend:ci ./backend
      - name: Build frontend image
        # The frontend Dockerfile requires the repo root as build context
        # (it COPYs frontend/ and docs/ — see the note in frontend/Dockerfile).
        run: docker build -t prov-frontend:ci -f frontend/Dockerfile .

  go-lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    # Blocking: the ruleset (govet/staticcheck/errcheck/ineffassign/unused/gosec)
    # is verified clean across all three modules. Genuine findings are fixed and
    # deliberate exceptions are annotated with //nolint + a reason.
    strategy:
      fail-fast: false
      matrix:
        module: [backend, sdk, terraform-provider-provenance]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: golangci-lint
        # v8 installs golangci-lint v2, which the .golangci.yml files use (v2 schema).
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Pinned, and matched by `make lint`. `latest` let each new release add
          # rules and fail builds that had not changed, with nothing local to show it.
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          # Each module ships its own .golangci.yml (backend: full ruleset incl. gosec;
          # sdk/provider: defect-focused defaults with test-file exclusions).
          args: --timeout=10m

  govulncheck:
    name: govulncheck (go1.26.6)
    runs-on: ubuntu-latest
    # security.yml also runs govulncheck weekly and on push to main; this keeps
    # it on the PR path, pinned to the bumped 1.26.6 toolchain the modules
    # declare (via go-version-file), so a newly reachable stdlib CVE is caught
    # before merge.
    strategy:
      fail-fast: false
      matrix:
        module: [backend, sdk, terraform-provider-provenance]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    # Blocking: eslint runs clean (0 errors) across the tree; style items surface
    # as warnings, real problems as errors.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # help-content.ts is generated and git-ignored; eslint ignores it, but the
      # build-help step keeps parity with the other frontend jobs.
      - run: npm run build-help && npm run build-guac-player
      - run: npm run lint

  sidecars:
    name: Sidecars (builder-runner · dockerproxy)
    runs-on: ubuntu-latest
    # Blocking, and worth blocking on. Both of these sit in front of the Docker
    # socket: the proxy IS the allowlist, and the runner's token is the only
    # thing between the container network and the ability to start a privileged
    # container. Neither is exercised by the Go suite.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r deploy/builder-runner/requirements.txt httpx
      # Every route the runner exposes must refuse a missing and a wrong token.
      # The routes are enumerated from the app, so one added without the guard
      # fails here rather than being quietly reachable.
      - name: Builder-runner authentication
        run: python deploy/builder-runner/test_auth.py
      # The proxy's allowlist rules, without needing a Docker daemon. The
      # daemon-backed half lives in scripts/imaging/test-docker-proxy.sh.
      - name: Docker proxy rules
        run: python deploy/dockerproxy/test_rules.py
