name: Release

# Tag-triggered publish pipeline. Pushing a semver tag (e.g. `v0.70.5`) builds
# the backend and frontend images, pushes them to GHCR under the real
# `kforbus3/provenance-*` namespace, generates an SBOM per image, and signs
# both images with cosign keyless (Sigstore OIDC — no long-lived key).
#
# Note: this workflow deliberately does NOT sign or publish the `.provup`
# update bundle. That bundle is signed with the maintainer's release key, which
# is offline on the maintainer's machine by design (see the deploy runbook) and
# is never present in CI. Bundle building stays a manual, local step; only the
# container images are published here.

on:
  push:
    tags:
      - 'v*'

# Least privilege, widened only where a step needs it:
#   packages: write  -> push images to GHCR
#   id-token: write  -> cosign keyless signing via the GitHub OIDC provider
#   contents: read   -> checkout
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercased, real namespace. The old ci.yml referenced
  # ghcr.io/provenance/* which never existed.
  BACKEND_IMAGE: ghcr.io/kforbus3/provenance-backend
  FRONTEND_IMAGE: ghcr.io/kforbus3/provenance-frontend

jobs:
  publish:
    name: Build · push · SBOM · sign (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/kforbus3/provenance-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            image: ghcr.io/kforbus3/provenance-frontend
            # The frontend Dockerfile COPYs frontend/ and docs/, so its build
            # context is the repository root (see frontend/Dockerfile).
            context: .
            dockerfile: ./frontend/Dockerfile
          # The three sidecars below ship in every .provup bundle
          # (BUNDLE_COMPONENTS in the Makefile) but were not built, signed or
          # scanned here -- so the signed, SBOM'd surface was two of the five
          # images an operator actually installs. A sidecar is not a lesser
          # target: ansible-runner executes playbooks as root on every managed
          # host, and prov-updater replaces the running stack.
          - name: grype-scanner
            image: ghcr.io/kforbus3/provenance-grype-scanner
            context: ./deploy/grype-scanner
            dockerfile: ./deploy/grype-scanner/Dockerfile
          - name: ansible-runner
            image: ghcr.io/kforbus3/provenance-ansible-runner
            context: ./deploy/ansible-runner
            dockerfile: ./deploy/ansible-runner/Dockerfile
          - name: prov-updater
            image: ghcr.io/kforbus3/provenance-prov-updater
            context: ./backend
            dockerfile: ./backend/Dockerfile.updater
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          # The git tag (e.g. 0.70.5, stripped of the leading `v`) and `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Record how the image was built. mode=max captures the build arguments and
          # the base-image chain, which is the part an auditor asks about.
          #
          # Note for whoever enables Actions: this turns the pushed reference into an
          # image index carrying an attestation manifest, so `steps.build.outputs.digest`
          # below names that index rather than a bare manifest. cosign signs it and the
          # SBOM step describes it, which is what we want -- but neither has been
          # exercised, because these workflows have never run on this repository.
          provenance: mode=max

      # Generate an SBOM for the pushed image (by digest, so it describes exactly
      # what was published). anchore/sbom-action wraps syft; it writes the SBOM
      # to a file we hand to cosign below and also uploads it as a build artifact.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing: cosign obtains a short-lived certificate from Fulcio
      # using the workflow's OIDC identity (id-token: write) and records the
      # signature in the Rekor transparency log. No private key is stored.
      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      # Attach the SBOM to the image as a keyless attestation. Consumers can
      # verify both the signature and the SBOM against the workflow identity
      # with `cosign verify` / `cosign verify-attestation`.
      - name: Attest SBOM (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.name }}.spdx.json" \
            --type spdxjson \
            "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
