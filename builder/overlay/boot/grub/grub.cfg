# GRUB A/B boot configuration for RAUC.
#
# /boot is shared, but each slot has its own kernel and initramfs under /A and
# /B so an update can replace the inactive slot's kernel without touching the
# running one -- which is what keeps rollback honest. The names carry no
# version, so this file never has to change when a kernel does. GRUB's
# prefix lives on the BOOT partition, so /vmlinuz and /initrd.img below refer to
# files on BOOT. The root= parameter selects which root slot to boot. Persistent
# slot state lives in grubenv (written by RAUC via grub-editenv).

set timeout=3
set default=0

if [ -s ${prefix}/grubenv ]; then
    load_env
fi

if [ "${ORDER}" = "" ]; then set ORDER="A B"; fi
if [ "${A_TRY}" = "" ]; then set A_TRY="0"; fi
if [ "${B_TRY}" = "" ]; then set B_TRY="0"; fi
# _OK is RAUC's variable for "this slot is usable". Default to 1 so an image
# built before these existed still boots; RAUC clears it to disable a slot.
if [ "${A_OK}" = "" ]; then set A_OK="1"; fi
if [ "${B_OK}" = "" ]; then set B_OK="1"; fi
# _PROVEN is "this slot has booted successfully at least once since it was last
# written". Only an UNPROVEN slot is put on probation; a proven one just boots.
#
# This is the difference between a fallback that protects an update and one that
# fires on an ordinary Tuesday. The counter used to be armed on every single
# boot, so every boot had to be blessed by ab-mark-good before the next reboot,
# forever -- and a machine that was merely rebooted before that unit got its
# turn came up on the other slot, then did the same in reverse, alternating for
# the rest of its life. Arming only what has actually changed is what Android
# (successful/tries_remaining), ChromeOS (cgpt successful/tries) and
# systemd-boot (entry+N-M.conf) all do; the counter is a property of an update,
# not of booting.
#
# Defaults to 1 so a machine imaged or updated before this existed keeps booting
# the slot it is on rather than being put on probation by a grub.cfg it did not
# ship with.
if [ "${A_PROVEN}" = "" ]; then set A_PROVEN="1"; fi
if [ "${B_PROVEN}" = "" ]; then set B_PROVEN="1"; fi

# Pick the first slot in ORDER that is usable. A proven slot is usable outright.
# An unproven one is usable once -- that is the probation an update gets -- and
# arming it is the only case in which this file writes to grubenv at all, so an
# ordinary boot no longer touches /boot.
set armed="0"
for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then
        if [ "${A_PROVEN}" = "1" ]; then
            set default=0
            break
        fi
        if [ "${A_TRY}" = "0" ]; then
            set default=0
            set A_TRY="1"
            set armed="1"
            break
        fi
    fi
    if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then
        if [ "${B_PROVEN}" = "1" ]; then
            set default=1
            break
        fi
        if [ "${B_TRY}" = "0" ]; then
            set default=1
            set B_TRY="1"
            set armed="1"
            break
        fi
    fi
done
if [ "${armed}" = "1" ]; then
    save_env A_TRY B_TRY
fi

# __ROOTFLAG__ is rw or ro, substituted at build time from --state-model.
#
# The default overlay model needs rw: fstab cannot carry a "/" entry because the
# root device differs per A/B slot, so nothing would ever remount the root
# read-write — leaving /var and /etc read-only (breaks systemd-logind's
# StateDirectory, the first-boot-expand stamp, and LUKS enrollment). The
# initramfs still fscks the root before mounting it.
#
# The stateful and appliance models use ro, which is the whole point of them:
# /usr cannot be written, so nothing a machine does can shadow a binary an
# update just delivered. They make /etc, /var and the rest writable by
# enumerating them in the state manifest instead, so the three things above
# still have somewhere to write.
set CMDLINE="__ROOTFLAG__ quiet console=tty0 console=ttyS0,115200 systemd.show_status=1"

menuentry "__OS__ A/B - Slot A (rootfs.0)" {
    linux /A/vmlinuz root=LABEL=rootfs-a rauc.slot=A ${CMDLINE}
    initrd /A/initrd.img
}

menuentry "__OS__ A/B - Slot B (rootfs.1)" {
    linux /B/vmlinuz root=LABEL=rootfs-b rauc.slot=B ${CMDLINE}
    initrd /B/initrd.img
}

# --- recovery ----------------------------------------------------------------
#
# Everything written since imaging lives on the overlay partition, and most of
# it is shared by both slots so that an A/B update does not destroy /home. The
# cost is that a bad change there follows you into the other slot, so booting
# the other slot is not by itself a way out. These entries are that way out.
#
# On an image built with --slot-private-upper the slots do not share the overlay
# at all, so the two normal entries above are already a way out of a bad change,
# and "reset" here sets aside only the booted slot's layer.
#
# They MUST stay below the two entries above: the try-counter logic at the top
# sets default=0 or default=1, so anything appended here is never selected
# automatically. Reaching one takes a person choosing it at the menu.
#
#   reset  sets the writable state aside as /var/lib/overlay/*.prev (a rename --
#          nothing is deleted) and boots with empty stores. One boot only.
#   off    ignores the state manifest entirely and boots the root slot exactly
#          as the imager wrote it. Use it to tell whether a problem is in the
#          image or in what the machine wrote on top of it, and to get in and
#          repair things by hand.
#
# The off entries force rw regardless of the model. Under stateful or appliance
# the slot is normally read-only and everything writable comes from the manifest
# -- which is exactly what these entries switch off, so without this the
# recovery boot would land you on a system with nowhere to write anything,
# which is not a recovery.
#
# ab.state= is the current spelling; the engine still accepts ab.overlay= so a
# runbook written against an older image keeps working.
#
# `ab-overlay-diff` inside the running system lists what the machine has written
# and what it is shadowing, which is usually how you decide which of these you
# need.

menuentry "Recovery: Slot A, reset writable state (keeps a copy)" {
    linux /A/vmlinuz root=LABEL=rootfs-a rauc.slot=A ab.state=reset ${CMDLINE}
    initrd /A/initrd.img
}

menuentry "Recovery: Slot B, reset writable state (keeps a copy)" {
    linux /B/vmlinuz root=LABEL=rootfs-b rauc.slot=B ab.state=reset ${CMDLINE}
    initrd /B/initrd.img
}

menuentry "Recovery: Slot A, image as written (no writable state)" {
    linux /A/vmlinuz root=LABEL=rootfs-a rauc.slot=A ab.state=off ${CMDLINE} rw
    initrd /A/initrd.img
}

menuentry "Recovery: Slot B, image as written (no writable state)" {
    linux /B/vmlinuz root=LABEL=rootfs-b rauc.slot=B ab.state=off ${CMDLINE} rw
    initrd /B/initrd.img
}
