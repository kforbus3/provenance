[system]
compatible=debian-ab
bootloader=grub
grubenv=/boot/grub/grubenv

[keyring]
path=/etc/rauc/keyring.pem

# Runs after every successful install, however it was started -- `ab-update`,
# `rauc install` typed by hand, or the D-Bus API. It puts the slot that was just
# written on probation (<SLOT>_PROVEN=0), which is what gives an update its
# one-shot automatic fallback. Without it an updated slot boots with no rollback.
[handlers]
post-install=/usr/local/sbin/ab-slot-pending.sh

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B
