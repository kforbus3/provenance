# GoReleaser configuration for publishing terraform-provider-fleet to the
# Terraform Registry. This is the standard HashiCorp provider layout.
#
# The registry expects, per tag:
#   - one zip per OS/arch:  terraform-provider-fleet_<version>_<os>_<arch>.zip
#   - a SHA256SUMS file and a detached GPG signature of it
#   - the provider manifest (terraform-registry-manifest.json)
#
# Release is driven from the monorepo checkout, so the local `replace
# github.com/kforbus3/Fleet-Terminal/sdk => ../sdk` in go.mod resolves normally
# (the SDK is not published as a standalone module). Run from this directory.
#
# Required at release time:
#   GPG_FINGERPRINT  - fingerprint of the key registered with the registry
#   GITHUB_TOKEN     - to create the GitHub release goreleaser publishes to
#
# NOTE: this signs the *provider* release with the registry GPG key. It is
# unrelated to the offline `.fleetup` bundle key, which never lives in CI.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # GPG detached signature over the SHA256SUMS file, per registry spec.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Publish as a draft so a human can review before the registry ingests it.
  draft: true

changelog:
  disable: true
