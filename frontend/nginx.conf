# nginx serves the SPA and reverse-proxies API + WebSocket traffic to the backend.
#
# This file is an nginx TEMPLATE: the base image's entrypoint runs envsubst over it
# (substituting ${BACKEND_HOST}) and writes the rendered config into
# /etc/nginx/conf.d/. The same image works unchanged whether the backend Service is
# "backend" (Docker Compose) or "provenance-backend" (Kubernetes, via BACKEND_HOST).
# (In Kubernetes the backend Service has a stable ClusterIP; kube-proxy routes it
# to the current pods.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    # Security headers (CSP is intentionally strict; adjust if adding CDNs).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # The backend is reached through a VARIABLE, like Headlamp and Aldgate below, and
    # for the same reason — which bit harder here than anywhere else. With a literal
    # upstream nginx resolves "backend" at startup and REFUSES TO START if it cannot:
    # so every time the backend was down or misconfigured, nginx exited too and the UI
    # was not a page saying something was wrong, it was a connection refused. A QA
    # install with one wrong value in .env showed nothing at all until somebody thought
    # to read `docker logs`. Resolved per request, a missing backend is a 502 on /api/
    # and the application still loads.
    resolver ${DNS_RESOLVER} ipv6=off valid=30s;
    set $prov_backend "${BACKEND_HOST}";

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src 'self'; frame-ancestors 'none'" always;

    # API + WebSocket proxy.
    location /api/ {
        proxy_pass http://$prov_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # Allow large SFTP transfers; the backend enforces the real cap
        # (PROV_MAX_UPLOAD_BYTES). Stream uploads instead of buffering to disk.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Headlamp, embedded rather than linked to.
    #
    # Served under this origin so the SPA can frame it: the server-level
    # X-Frame-Options DENY would otherwise block the iframe. nginx's add_header
    # does not merge with inherited ones, so the headers this location still
    # wants are repeated rather than assumed.
    #
    # proxy_pass goes through a VARIABLE on purpose. With a literal upstream name
    # nginx resolves it at startup and REFUSES TO START if it does not exist --
    # which is every deployment that has not enabled the kubernetes profile. Via a
    # variable, resolution happens per request, so a missing Headlamp is a 502 on
    # this path instead of a frontend that will not boot.
    location /headlamp/ {
        resolver ${DNS_RESOLVER} ipv6=off valid=30s;
        set $headlamp_upstream "${HEADLAMP_HOST}";
        proxy_pass http://$headlamp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Watches and log follows are long-lived and must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Aldgate's log console (OpenSearch Dashboards), proxied under this origin.
    #
    # Same arrangement and the same reasons as /headlamp/ above: served here so
    # the SPA can frame it and so there is one place to be, and through a
    # VARIABLE proxy_pass so a deployment with no collector is a 502 on this one
    # path rather than an nginx that refuses to start.
    #
    # Unlike Headlamp, the collector is a separate MACHINE, so the upstream is a
    # host:port from the environment rather than a compose service name.
    # The console's authorization check. Internal, so a browser cannot call it
    # directly and read the credential out of the response headers.
    location = /internal/aldgate-authz {
        internal;
        proxy_pass http://$prov_backend/api/v1/logs/console-authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /aldgate/ {
        resolver ${DNS_RESOLVER} ipv6=off valid=30s;
        set $aldgate_upstream "${ALDGATE_HOST}";

        # Provenance decides who reaches the console, and as whom.
        #
        # This used to be a bare proxy: Dashboards asked for its own username and
        # password, so the only credential that worked was the collector's admin
        # account -- every privilege there is -- and a Provenance role had no
        # bearing on any of it. Anyone who could load the frontend could reach the
        # console's login form, and the collector never knew who was asking.
        #
        # Now every request is checked by the backend, which answers with the
        # collector credential for the tier that person's permissions earn. nginx
        # copies it into the proxied request; the browser is never sent it. A
        # request with no console cookie, or from somebody without Logs.View, is
        # refused here and never reaches Dashboards.
        auth_request /internal/aldgate-authz;
        auth_request_set $aldgate_auth $upstream_http_x_aldgate_authorization;
        proxy_set_header Authorization $aldgate_auth;

        # Pin the console to the GLOBAL tenant.
        #
        # Dashboards has multi-tenancy on, and its default preference is a user's
        # PRIVATE tenant -- which for a fresh account is empty. The dashboard, the
        # saved searches and both index patterns are shared, so without this a
        # person signs in successfully and finds a console with no data sources in
        # it, which is indistinguishable from a collector that never received
        # anything. `securitytenant` is already whitelisted in the collector's
        # opensearch.requestHeadersWhitelist.
        proxy_set_header securitytenant global;
        # NO trailing slash, so the /aldgate/ prefix is forwarded intact.
        # Dashboards runs with SERVER_BASEPATH=/aldgate and REWRITEBASEPATH=true,
        # which means it EXPECTS the prefix and strips it itself. Stripping it
        # here as well -- which a trailing slash does -- made every request a 404
        # from Dashboards while nginx looked perfectly correct.
        proxy_pass http://$aldgate_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /health {
        proxy_pass http://$prov_backend/health;
    }
    location = /version {
        proxy_pass http://$prov_backend/version;
    }

    # Build assets are content-hashed (e.g. index-AbC123.js), so their contents can
    # never change under a fixed name — cache them hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must always be revalidated: after an in-UI upgrade the build emits new
    # hashed asset names, and a cached index.html would keep pointing browsers at the
    # old chunks (users would run stale code until a manual hard-refresh). `expires -1`
    # sets Cache-Control: no-cache without an add_header, so the inherited security
    # headers (CSP, X-Frame-Options, …) still apply to the document.
    location = /index.html {
        expires -1;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
