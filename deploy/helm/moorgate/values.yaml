# Default values for the fleet-terminal chart.
# Override with `-f my-values.yaml` or `--set key=value`.

nameOverride: ""
fullnameOverride: ""

# Cluster-wide image pull secrets (referenced by all workloads).
imagePullSecrets: []

# -- Backend (Go API + SSH gateway) ------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/kforbus3/moorgate-backend
    tag: ""            # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  metrics:
    # Adds prometheus.io scrape annotations to Service + Pods.
    scrape: true
    port: 8080
    path: /metrics
  # Graceful shutdown. terminationGracePeriodSeconds MUST exceed the backend's
  # FLEET_SHUTDOWN_TIMEOUT (default 20s) so live SSH/terminal/RDP sessions drain on
  # SIGTERM before SIGKILL. preStopSleepSeconds lets Service endpoints deregister
  # before the container is signalled (native sleep action; 0 disables the hook).
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 5
  # Shared state for the backend replicas: session recordings, scan artifacts,
  # backups, and staged upgrade bundles (mounted as subPaths of one volume).
  # With replicaCount>1 or autoscaling this MUST be ReadWriteMany-capable storage
  # (NFS/CephFS/EFS/Azure Files/Filestore) — otherwise recording replay 404s on the
  # wrong pod and retention prunes only one pod's files. When disabled an emptyDir is
  # used (single-replica/dev only).
  persistence:
    enabled: false
    accessMode: ReadWriteMany
    size: 20Gi
    storageClass: ""

# -- Frontend (React SPA via nginx) ------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/kforbus3/moorgate-frontend
    tag: ""            # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# -- Non-secret backend configuration (rendered into a ConfigMap) ------------
config:
  FLEET_ENV: "production"
  FLEET_HTTP_ADDR: ":8080"
  FLEET_PUBLIC_URL: "https://fleet.example.com"
  FLEET_COOKIE_SECURE: "true"
  FLEET_LOG_LEVEL: "info"
  FLEET_LOG_FORMAT: "json"
  FLEET_MIGRATE_ON_START: "true"
  FLEET_ALLOW_BOOTSTRAP: "false"
  FLEET_DB_MAX_CONNS: "20"
  FLEET_DB_MIN_CONNS: "2"
  FLEET_JUMP_HOST: "jumphost:22"
  FLEET_JUMP_USER: "fleet"
  # On-disk paths — all subpaths of the shared backend.persistence volume.
  FLEET_RECORDING_DIR: "/var/lib/fleet/recordings"
  FLEET_SCAN_DIR: "/var/lib/fleet/scans"
  FLEET_BACKUP_DIR: "/var/lib/fleet/backups"
  FLEET_UPDATES_DIR: "/var/lib/fleet/updates"
  # FLEET_ANSIBLE_RUNNER_URL / FLEET_GRYPE_SCANNER_URL are derived from the release
  # name in the ConfigMap template (they point at the in-chart sidecar Services).

# -- Secrets ------------------------------------------------------------------
# If create=true, a Secret is rendered from the values below (use --set or a
# sealed/External Secret in production). If create=false, an existing Secret
# named `existingSecret` must provide the same keys.
#
# In production the backend FAILS CLOSED at boot unless jwtSecret, csrfSecret,
# caPassphrase, auditHmacKey, and ansibleRunnerToken are real values. vaultPassphrase
# and backupPassphrase must each DIFFER from caPassphrase. Generate each with
# `openssl rand -hex 32`. NEVER commit real values — override via --set or a
# sealed/External Secret.
secrets:
  create: true
  existingSecret: ""
  jwtSecret: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  csrfSecret: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  caPassphrase: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Required to use the credential vault / encrypted backups; each MUST differ from
  # caPassphrase.
  vaultPassphrase: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  backupPassphrase: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Tamper-evident audit chain key (required in production, >=32 bytes).
  auditHmacKey: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Shared secret authenticating the backend to the ansible-runner sidecar (required
  # in production, >=16 bytes). The ansible-runner Deployment reads the same value.
  ansibleRunnerToken: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Encrypts session recordings at rest (optional but recommended, >=32 bytes).
  recordingKey: "REPLACE_WITH_OPENSSL_RAND_HEX_32"

# -- PostgreSQL (in-chart single primary) ------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: fleet
    database: fleet
    password: "REPLACE_WITH_STRONG_PASSWORD"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  # max_connections must exceed (backend replicas × FLEET_DB_MAX_CONNS) + a couple per
  # replica for the HA leader lock / event backplane. With autoscaling.maxReplicas=10
  # and FLEET_DB_MAX_CONNS=20 that is ~220, well past the stock 100 — 300 leaves
  # headroom. For real HA use an external pooled Postgres and set postgres.enabled=false.
  maxConnections: 300
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # When postgres.enabled=false, point the backend at an external database.
  externalDatabaseUrl: ""

# -- Ansible runner sidecar --------------------------------------------------
# Validates/lints (and runs) playbooks. The backend authenticates to it with
# secrets.ansibleRunnerToken. No public image is published — build/push from
# deploy/ansible-runner.
ansibleRunner:
  enabled: true
  image:
    repository: ghcr.io/kforbus3/moorgate-ansible-runner
    tag: ""            # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# -- Grype scanner sidecar ---------------------------------------------------
# Runs Anchore Grype vulnerability scans. The ~1 GB vuln DB is fetched at runtime
# and persisted on a PVC. Build/push from deploy/grype-scanner.
grypeScanner:
  enabled: true
  image:
    repository: ghcr.io/kforbus3/moorgate-grype-scanner
    tag: ""            # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  scanConcurrency: 2
  scanTimeout: 1200
  dbTimeout: 900
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# -- Redis (in-chart) --------------------------------------------------------
# NOTE: the app does NOT use Redis (FLEET_REDIS_URL is parsed and ignored). This is
# retained for compatibility and defaults to disabled; leave it off unless something
# external in your deployment expects it.
redis:
  enabled: false
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  url: "redis://{{ .Release.Name }}-redis:6379/0"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Ingress ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: fleet.example.com
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  tls:
    enabled: true
    secretName: fleet-tls
