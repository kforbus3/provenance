apiVersion: v1
kind: Service
metadata:
  name: {{ include "moorgate.backend.fullname" . }}
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.backend.metrics.scrape }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.backend.metrics.port | quote }}
    prometheus.io/path: {{ .Values.backend.metrics.path | quote }}
  {{- end }}
spec:
  selector:
    {{- include "moorgate.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moorgate.backend.fullname" . }}
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "moorgate.selectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moorgate.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.backend.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.metrics.port | quote }}
        prometheus.io/path: {{ .Values.backend.metrics.path | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Must exceed FLEET_SHUTDOWN_TIMEOUT so live SSH/terminal/RDP sessions drain on
      # SIGTERM before SIGKILL (the preStop sleep is part of this budget).
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "moorgate.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- if gt (int .Values.backend.preStopSleepSeconds) 0 }}
          # Let Service endpoints deregister before the container is signalled, so no
          # new request/session is routed here mid-shutdown (native sleep action).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.backend.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "moorgate.fullname" . }}-config
            - secretRef:
                name: {{ include "moorgate.secretName" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Shared state as subPaths of one volume. With replicas>1 / autoscaling this
            # must be ReadWriteMany (backend.persistence.accessMode) or recording replay
            # and retention pruning break across pods.
            - name: fleet-data
              mountPath: {{ .Values.config.FLEET_RECORDING_DIR | quote }}
              subPath: recordings
            - name: fleet-data
              mountPath: {{ .Values.config.FLEET_SCAN_DIR | quote }}
              subPath: scans
            - name: fleet-data
              mountPath: {{ .Values.config.FLEET_BACKUP_DIR | quote }}
              subPath: backups
            - name: fleet-data
              mountPath: {{ .Values.config.FLEET_UPDATES_DIR | quote }}
              subPath: updates
      volumes:
        - name: tmp
          emptyDir: {}
        - name: fleet-data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "moorgate.backend.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.backend.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "moorgate.backend.fullname" . }}-data
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  accessModes: [{{ .Values.backend.persistence.accessMode | quote }}]
  {{- if .Values.backend.persistence.storageClass }}
  storageClassName: {{ .Values.backend.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size | quote }}
{{- end }}
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "moorgate.backend.fullname" . }}
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "moorgate.backend.fullname" . }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.backend.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
