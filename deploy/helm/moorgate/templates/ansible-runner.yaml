{{- if .Values.ansibleRunner.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moorgate.ansibleRunner.fullname" . }}
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ansible-runner
spec:
  selector:
    {{- include "moorgate.selectorLabels" (dict "context" . "component" "ansible-runner") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moorgate.ansibleRunner.fullname" . }}
  labels:
    {{- include "moorgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "moorgate.selectorLabels" (dict "context" . "component" "ansible-runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moorgate.labels" . | nindent 8 }}
        app.kubernetes.io/component: ansible-runner
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ansible-runner
          image: "{{ .Values.ansibleRunner.image.repository }}:{{ default .Chart.AppVersion .Values.ansibleRunner.image.tag }}"
          imagePullPolicy: {{ .Values.ansibleRunner.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FLEET_ANSIBLE_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "moorgate.secretName" . }}
                  key: FLEET_ANSIBLE_RUNNER_TOKEN
            # HOME on the writable emptyDir so Ansible's ~/.ansible tmp/collection cache
            # and ansible-lint's ~/.cache work with the read-only root fs.
            - name: HOME
              value: /home/runner
            # Connection/become-prompt timeout — see values.ansibleRunner.ansibleTimeout.
            - name: FLEET_ANSIBLE_TIMEOUT
              value: {{ .Values.ansibleRunner.ansibleTimeout | default 30 | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.ansibleRunner.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # Immutable root fs; Ansible writes temp/collection files under HOME and
            # scratch playbooks under /tmp, mounted as writable emptyDir volumes below.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
