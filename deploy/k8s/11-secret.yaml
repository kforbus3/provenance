# TEMPLATE secret — DO NOT COMMIT REAL VALUES.
# Generate strong secrets before applying, e.g.:
#   kubectl -n fleet-terminal create secret generic fleet-secrets \
#     --from-literal=FLEET_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_CSRF_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_CA_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_VAULT_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_BACKUP_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_AUDIT_HMAC_KEY="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_ANSIBLE_RUNNER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=FLEET_RECORDING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=FLEET_DATABASE_URL="postgres://fleet:CHANGE_ME@fleet-postgres:5432/fleet?sslmode=disable"
#
# The manifest below uses stringData with placeholders so it can be templated
# by a secrets manager (Sealed Secrets, External Secrets, SOPS, Vault, etc.).
#
# In production (FLEET_ENV=production) the backend FAILS CLOSED at boot unless
# FLEET_JWT_SECRET, FLEET_CSRF_SECRET, FLEET_CA_PASSPHRASE, FLEET_AUDIT_HMAC_KEY, and
# FLEET_ANSIBLE_RUNNER_TOKEN are all set to real values — placeholders left as-is will
# prevent startup. FLEET_VAULT_PASSPHRASE and FLEET_BACKUP_PASSPHRASE are required to
# use the credential vault / encrypted backups and MUST each differ from
# FLEET_CA_PASSPHRASE. FLEET_RECORDING_KEY is optional but recommended (unset =
# recordings stored unencrypted).
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  FLEET_JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  FLEET_CSRF_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  FLEET_CA_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Credential vault + encrypted backups. Each MUST differ from FLEET_CA_PASSPHRASE.
  FLEET_VAULT_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  FLEET_BACKUP_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Tamper-evident audit chain key (>=32 bytes). Required in production.
  FLEET_AUDIT_HMAC_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Shared secret authenticating the backend to the ansible-runner sidecar (>=16
  # bytes). Required in production; the ansible-runner Deployment reads the same value.
  FLEET_ANSIBLE_RUNNER_TOKEN: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Encrypts session recordings at rest (>=32 bytes). Optional but recommended.
  FLEET_RECORDING_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  # Must reference the same POSTGRES_PASSWORD value above.
  FLEET_DATABASE_URL: "postgres://fleet:REPLACE_WITH_STRONG_PASSWORD@fleet-postgres:5432/fleet?sslmode=disable"
