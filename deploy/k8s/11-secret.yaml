# TEMPLATE secret — DO NOT COMMIT REAL VALUES.
# Generate strong secrets before applying, e.g.:
#   kubectl -n provenance create secret generic prov-secrets \
#     --from-literal=PROV_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PROV_CSRF_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PROV_CA_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=PROV_VAULT_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=PROV_BACKUP_PASSPHRASE="$(openssl rand -hex 32)" \
#     --from-literal=PROV_AUDIT_HMAC_KEY="$(openssl rand -hex 32)" \
#     --from-literal=PROV_ANSIBLE_RUNNER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=PROV_RECORDING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=PROV_DATABASE_URL="postgres://prov:CHANGE_ME@prov-postgres:5432/prov?sslmode=disable"
#
# The manifest below uses stringData with placeholders so it can be templated
# by a secrets manager (Sealed Secrets, External Secrets, SOPS, Vault, etc.).
#
# In production (PROV_ENV=production) the backend FAILS CLOSED at boot unless
# PROV_JWT_SECRET, PROV_CSRF_SECRET, PROV_CA_PASSPHRASE, PROV_AUDIT_HMAC_KEY, and
# PROV_ANSIBLE_RUNNER_TOKEN are all set to real values — placeholders left as-is will
# prevent startup. PROV_VAULT_PASSPHRASE and PROV_BACKUP_PASSPHRASE are required to
# use the credential vault / encrypted backups and MUST each differ from
# PROV_CA_PASSPHRASE. PROV_RECORDING_KEY is optional but recommended (unset =
# recordings stored unencrypted).
apiVersion: v1
kind: Secret
metadata:
  name: prov-secrets
  namespace: provenance
  labels:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  PROV_JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  PROV_CSRF_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  PROV_CA_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Credential vault + encrypted backups. Each MUST differ from PROV_CA_PASSPHRASE.
  PROV_VAULT_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  PROV_BACKUP_PASSPHRASE: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Tamper-evident audit chain key (>=32 bytes). Required in production.
  PROV_AUDIT_HMAC_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Shared secret authenticating the backend to the ansible-runner sidecar (>=16
  # bytes). Required in production; the ansible-runner Deployment reads the same value.
  PROV_ANSIBLE_RUNNER_TOKEN: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  # Encrypts session recordings at rest (>=32 bytes). Optional but recommended.
  PROV_RECORDING_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  # Must reference the same POSTGRES_PASSWORD value above.
  PROV_DATABASE_URL: "postgres://prov:REPLACE_WITH_STRONG_PASSWORD@prov-postgres:5432/prov?sslmode=disable"
