# Ansible runner sidecar — validates/lints (and runs) playbooks for the backend.
# Internal only (ClusterIP): the backend reaches it at http://fleet-ansible-runner:8000
# and authenticates every execute/check call with FLEET_ANSIBLE_RUNNER_TOKEN.
apiVersion: v1
kind: Service
metadata:
  name: fleet-ansible-runner
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: ansible-runner
spec:
  selector:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: ansible-runner
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-ansible-runner
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-terminal
      app.kubernetes.io/component: ansible-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-terminal
        app.kubernetes.io/component: ansible-runner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ansible-runner
          # Build/push from deploy/ansible-runner (no public image is published).
          image: ghcr.io/kforbus3/moorgate-ansible-runner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FLEET_ANSIBLE_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: FLEET_ANSIBLE_RUNNER_TOKEN
            # Point HOME at the writable emptyDir so Ansible's ~/.ansible tmp/collection
            # cache and ansible-lint's ~/.cache land on a writable mount (root fs is RO).
            - name: HOME
              value: /home/runner
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            # Immutable root fs. The runner still needs to write Ansible temp/collection
            # files under HOME and scratch playbooks under /tmp, so both are mounted as
            # writable emptyDir volumes below (it drops all caps and runs unprivileged).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
