# Non-secret runtime configuration shared by the backend pods.
# Secrets (JWT/CSRF/CA passphrase, DB password) live in 11-secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prov-config
  namespace: provenance
  labels:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: backend
data:
  PROV_ENV: "production"
  PROV_HTTP_ADDR: ":8080"
  PROV_PUBLIC_URL: "https://provenance.example.com"
  PROV_COOKIE_SECURE: "true"
  PROV_LOG_LEVEL: "info"
  PROV_LOG_FORMAT: "json"
  PROV_MIGRATE_ON_START: "true"
  PROV_ALLOW_BOOTSTRAP: "false"
  PROV_DB_MAX_CONNS: "20"
  PROV_DB_MIN_CONNS: "2"
  PROV_REDIS_URL: "redis://prov-redis:6379/0"
  PROV_JUMP_HOST: "jumphost:22"
  PROV_JUMP_USER: "prov"
  # On-disk paths — all live on the shared RWX volume (see 30-backend.yaml) so every
  # replica reads/writes the same files (recording replay, retention pruning, backups).
  PROV_RECORDING_DIR: "/var/lib/prov/recordings"
  PROV_SCAN_DIR: "/var/lib/prov/scans"
  PROV_BACKUP_DIR: "/var/lib/prov/backups"
  PROV_UPDATES_DIR: "/var/lib/prov/updates"
  # Internal sidecar endpoints (see 32-ansible-runner.yaml / 33-grype-scanner.yaml).
  PROV_ANSIBLE_RUNNER_URL: "http://prov-ansible-runner:8000"
  PROV_GRYPE_SCANNER_URL: "http://prov-grype-scanner:8000"
