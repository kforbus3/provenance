# Moorgate backend (Go API + SSH gateway).
apiVersion: v1
kind: Service
metadata:
  name: fleet-backend
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-backend
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-terminal
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-terminal
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Must exceed FLEET_SHUTDOWN_TIMEOUT (default 20s) so the backend can drain live
      # SSH/terminal/RDP sessions on SIGTERM before the kubelet SIGKILLs it. The preStop
      # sleep below is included in this budget.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/kforbus3/moorgate-backend:latest
          imagePullPolicy: IfNotPresent
          # Give kube-proxy/Ingress time to remove this pod from the Service endpoints
          # before the container receives SIGTERM, so no new request/session is routed
          # here mid-shutdown. Native sleep action (no shell needed in the image).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fleet-config
            - secretRef:
                name: fleet-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # All four dirs are subpaths of ONE shared ReadWriteMany volume so that,
            # with replicas>1 + the HPA, every replica sees the same files: recording
            # replay works from any pod, the leader's retention prune sees all pods'
            # recordings, and backups/updates are shared. RWO would break these.
            - name: fleet-data
              mountPath: /var/lib/fleet/recordings
              subPath: recordings
            - name: fleet-data
              mountPath: /var/lib/fleet/scans
              subPath: scans
            - name: fleet-data
              mountPath: /var/lib/fleet/backups
              subPath: backups
            - name: fleet-data
              mountPath: /var/lib/fleet/updates
              subPath: updates
      volumes:
        - name: tmp
          emptyDir: {}
        - name: fleet-data
          persistentVolumeClaim:
            claimName: fleet-shared-data
---
# Shared state for the backend replicas. REQUIRES a ReadWriteMany StorageClass
# (NFS, CephFS, AWS EFS, Azure Files, GCP Filestore, …). ReadWriteOnce will NOT work
# once replicas>1 lands pods on different nodes — recording replay 404s and retention
# prunes only one pod's files. Set storageClassName to your RWX class before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-shared-data
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
spec:
  accessModes: ["ReadWriteMany"]
  # storageClassName: nfs-client   # <-- set to an RWX-capable class
  resources:
    requests:
      storage: 20Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleet-backend
  namespace: fleet-terminal
  labels:
    app.kubernetes.io/name: fleet-terminal
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleet-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
