# Network vulnerability scanner sidecar (naabu + fingerprintx + nuclei). Internal only
# (ClusterIP): reachable at http://prov-net-scanner:8001, authenticated with
# PROV_NETSCAN_TOKEN from the provenance secret. It scans managed hosts at whatever
# addresses the pod network routes to (typically their LAN addresses); overlay
# addresses are reachable only from the jump host's network namespace, which is the
# single-server compose layout. Nuclei templates are fetched at runtime and persisted
# on a PVC (not baked into the image).
apiVersion: v1
kind: Service
metadata:
  name: prov-net-scanner
  namespace: provenance
  labels:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: net-scanner
spec:
  selector:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: net-scanner
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prov-net-scanner
  namespace: provenance
  labels:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: net-scanner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: provenance
      app.kubernetes.io/component: net-scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provenance
        app.kubernetes.io/component: net-scanner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: net-scanner
          # Build/push from deploy/net-scanner (no public image is published).
          image: ghcr.io/kforbus3/provenance-net-scanner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: NETSCAN_BIND
              value: "0.0.0.0"
            - name: NETSCAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prov-secrets
                  key: PROV_NETSCAN_TOKEN
                  optional: true
            - name: NETSCAN_PORT_RATE
              value: "1000"
            - name: NETSCAN_NUCLEI_RATE
              value: "100"
            - name: NETSCAN_CONCURRENCY
              value: "2"
            - name: NETSCAN_TIMEOUT
              value: "1800"
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: templates
              mountPath: /home/scanner/nuclei-templates
            - name: tmp
              mountPath: /tmp
            - name: nuclei-config
              mountPath: /home/scanner/.config
            - name: nuclei-cache
              mountPath: /home/scanner/.cache
            - name: pdcp
              mountPath: /home/scanner/.pdcp
      volumes:
        - name: templates
          persistentVolumeClaim:
            claimName: prov-netscan-templates
        - name: tmp
          emptyDir: {}
        - name: nuclei-config
          emptyDir: {}
        - name: nuclei-cache
          emptyDir: {}
        - name: pdcp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prov-netscan-templates
  namespace: provenance
  labels:
    app.kubernetes.io/name: provenance
    app.kubernetes.io/component: net-scanner
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
