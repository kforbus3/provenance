# Provenance jump host sshd overrides (loaded first via Include).
# Host keys under /etc/ssh/keys so they can be persisted on a volume in production
# (stable across restarts/upgrades for known_hosts pinning). The entrypoint
# generates them on first boot.
#
# THREE key types, not one. Ed25519 was the only one offered, and in FIPS mode the
# backend's SSH client offers only FIPS-approved host-key algorithms (ECDSA P-256/384,
# rsa-sha2-*) -- so it could not complete a handshake with its own jump host:
#
#   ssh: no common algorithm for host key; we offered ["ecdsa-sha2-nistp256" …],
#   peer offered ["ssh-ed25519"]
#
# Which meant a FIPS deployment could not enrol or reach ANY host: every connection
# goes through here. Offering all three changes nothing for a non-FIPS client (it
# still prefers Ed25519, so existing pinned host keys stay valid) and gives a FIPS
# client something it is allowed to use.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_ecdsa_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
# Trust certificates signed by the fleet user CA.
TrustedUserCAKeys /etc/ssh/prov_ca.pub
# Map the certificate principal to an allowed-principals file per user.
AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u
# The jump host only forwards onward to managed hosts; no shell needed but
# allowed for debugging.
AllowTcpForwarding yes
