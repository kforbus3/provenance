server {
    listen 80 default_server;
    root /var/www/weak;
}
server {
    listen 443 ssl default_server;
    root /var/www/weak;
    ssl_certificate     /etc/ssl/certs/weak.crt;
    ssl_certificate_key /etc/ssl/private/weak.key;
    # OpenSSL 3 refuses TLS 1.0/1.1 at its default security level; level 0 lets them back in.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
}
