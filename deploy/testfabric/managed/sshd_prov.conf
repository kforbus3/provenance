# Provenance managed host sshd overrides (loaded first via Include).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
# Trust certificates signed by the fleet user CA.
TrustedUserCAKeys /etc/ssh/prov_ca.pub
# Allow a certificate carrying the 'prov' principal to log in as user 'prov'.
AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u
