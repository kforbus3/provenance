# Provenance — application stack.
# Brings up Postgres, the Go backend, and the React frontend (plus the
# ansible-runner, grype-scanner, guacd, and prov-updater sidecars).
# The local SSH test fabric (jump host + managed hosts) lives in the
# docker-compose.testfabric.yml override.

name: provenance

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Connection sizing: each backend opens up to PROV_DB_MAX_CONNS (default 20)
    # plus a couple for the HA leader lock / event backplane. One backend fits the
    # stock max_connections=100; if you run several backends (see
    # docker-compose.ha.yml) or raise PROV_DB_MAX_CONNS, raise max_connections to
    # stay ahead of (backends × PROV_DB_MAX_CONNS + headroom). 200 covers the
    # bundled HA stack (2 backends) with room to grow.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: prov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prov}
      POSTGRES_DB: prov
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prov -d prov"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks: [prov]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        VERSION: ${PROV_VERSION:-${FLEET_VERSION:-dev}}
    # Stable image name so the in-UI updater can pin/roll back versioned images
    # (provenance-backend:<version>) with `docker compose up --no-build`.
    image: provenance-backend
    restart: unless-stopped
    # Give the backend time to shut down gracefully on a deploy/restart so it
    # releases its Postgres leader advisory lock (and drains connections) before
    # SIGKILL — otherwise a stranded lock delays the next instance becoming leader
    # (the monitor only sweeps as leader). The incoming instance also reclaims a
    # stranded lock, but a clean handoff is instant.
    stop_grace_period: 30s
    environment:
      # Where to write the embedded Headlamp's cluster list. Unset disables it,
      # which is every deployment not running the kubernetes profile.
      PROV_HEADLAMP_KUBECONFIG: ${PROV_HEADLAMP_KUBECONFIG:-/headlamp/clusters/kubeconfig}
      # Aldgate, for the Logs page. Empty disables it: the page then says how to
      # point at a collector instead of reporting a fault.
      PROV_ALDGATE_URL: ${PROV_ALDGATE_URL:-}
      PROV_ALDGATE_USER: ${PROV_ALDGATE_USER:-admin}
      PROV_ALDGATE_PASSWORD: ${PROV_ALDGATE_PASSWORD:-}
      # Console tiers. The embedded log console runs as one of these, picked from
      # the viewer's Provenance role, so nobody is asked for a collector password
      # and no browser is sent one. Both come from the collector's own .env, where
      # its bootstrap generates them. Unset means the console falls back to asking
      # for a password, which is what it did before this existed.
      PROV_ALDGATE_CONSOLE_VIEWER_USER: ${PROV_ALDGATE_CONSOLE_VIEWER_USER:-prov_viewer}
      PROV_ALDGATE_CONSOLE_VIEWER_PASSWORD: ${PROV_ALDGATE_CONSOLE_VIEWER_PASSWORD:-}
      PROV_ALDGATE_CONSOLE_ADMIN_USER: ${PROV_ALDGATE_CONSOLE_ADMIN_USER:-prov_admin}
      PROV_ALDGATE_CONSOLE_ADMIN_PASSWORD: ${PROV_ALDGATE_CONSOLE_ADMIN_PASSWORD:-}
      PROV_ENV: ${PROV_ENV:-${FLEET_ENV:-development}}
      # Applying migrations at startup. Off when the serving role is deliberately not
      # allowed to change the schema -- the multi-tenancy setup points PROV_DATABASE_URL
      # at a non-superuser role, and with this unset the backend exits at boot with
      # "create schema_migrations: permission denied for schema public".
      PROV_MIGRATE_ON_START: ${PROV_MIGRATE_ON_START:-}

      # Settings config.go reads that had no way in from here.
      #
      # Twenty-two of them, found by comparing config.go against this file during a QA
      # install -- including PROV_FIPS_MODE, PROV_OVERLAY and PROV_DR_STANDBY_TOKEN, so
      # the FIPS profile, the overlay choice and disaster-recovery standby could not be
      # turned on at all with the shipped stack. An empty default leaves each one unset,
      # so nothing changes until an operator puts it in .env. A test now fails when a
      # new setting appears in config.go without a line here.
      PROV_BACKUP_DIR: ${PROV_BACKUP_DIR:-}
      # The connection BACKUPS are taken over, when it differs from the serving one.
      # It must differ under multi-tenancy: the serving role is NOSUPERUSER
      # NOBYPASSRLS (that is what isolates tenants) and pg_dump as such a role fails on
      # every table with a row-level security policy, so a multi-tenant deployment can
      # otherwise take no backup — and therefore cannot upgrade, since the upgrade
      # refuses to start without one. Point it at the owner role migrations run as.
      PROV_BACKUP_DATABASE_URL: ${PROV_BACKUP_DATABASE_URL:-}
      PROV_CA_ROTATE_AFTER: ${PROV_CA_ROTATE_AFTER:-}
      PROV_DR_STANDBY_TOKEN: ${PROV_DR_STANDBY_TOKEN:-}
      PROV_FIPS_MODE: ${PROV_FIPS_MODE:-}
      PROV_GUACD_ADDR: ${PROV_GUACD_ADDR:-}
      PROV_IMAGING_SECRET_PREFIX: ${PROV_IMAGING_SECRET_PREFIX:-}
      PROV_KMS_AWS_SESSION_TOKEN: ${PROV_KMS_AWS_SESSION_TOKEN:-}
      PROV_KMS_GCP_CREDENTIALS: ${PROV_KMS_GCP_CREDENTIALS:-}
      PROV_KMS_VAULT_CACERT: ${PROV_KMS_VAULT_CACERT:-}
      PROV_KMS_VAULT_SKIP_VERIFY: ${PROV_KMS_VAULT_SKIP_VERIFY:-}
      PROV_METRIC_HISTORY_RETENTION: ${PROV_METRIC_HISTORY_RETENTION:-}
      PROV_METRIC_HISTORY_SAMPLE: ${PROV_METRIC_HISTORY_SAMPLE:-}
      PROV_MFA_ENCRYPTION_KEY: ${PROV_MFA_ENCRYPTION_KEY:-}
      PROV_MONITOR_CONFIRM_DELAY: ${PROV_MONITOR_CONFIRM_DELAY:-}
      PROV_MONITOR_OFFLINE_CONFIRMATIONS: ${PROV_MONITOR_OFFLINE_CONFIRMATIONS:-}
      PROV_MSRC_API_URL: ${PROV_MSRC_API_URL:-}
      PROV_MSRC_MONTHS: ${PROV_MSRC_MONTHS:-}
      PROV_OVERLAY: ${PROV_OVERLAY:-}
      # The backend reads this too, and until now only the jump host container
      # received it. Setting PROV_OVERLAY_PEER_ISOLATION=0 therefore turned
      # isolation off in the jump host while the backend went on generating
      # isolating overlay config and refusing hosts whose config was not isolated:
      # the two halves of one option disagreeing, with no way to set the backend's
      # half at all. Same default as the jump host's.
      PROV_OVERLAY_PEER_ISOLATION: ${PROV_OVERLAY_PEER_ISOLATION:-${FLEET_OVERLAY_PEER_ISOLATION:-1}}
      PROV_RDP_DRIVE_DIR: ${PROV_RDP_DRIVE_DIR:-}
      PROV_RDP_PROXY_HOST: ${PROV_RDP_PROXY_HOST:-}
      PROV_REDIS_URL: ${PROV_REDIS_URL:-}
      PROV_SHUTDOWN_TIMEOUT: ${PROV_SHUTDOWN_TIMEOUT:-}
      PROV_VULN_SCAN_TIMEOUT: ${PROV_VULN_SCAN_TIMEOUT:-}
      # Server timezone — schedules compute their next run in this zone. Set TZ
      # in .env to your local zone (e.g. America/New_York) so "03:00" means your
      # 3 AM; defaults to UTC.
      TZ: ${TZ:-UTC}
      PROV_HTTP_ADDR: ":8080"
      PROV_PUBLIC_URL: ${PROV_PUBLIC_URL:-${FLEET_PUBLIC_URL:-http://localhost:8080}}
      PROV_DATABASE_URL: ${PROV_DATABASE_URL:-${FLEET_DATABASE_URL:-postgres://prov:${POSTGRES_PASSWORD:-prov}@postgres:5432/prov?sslmode=disable}}
      PROV_JWT_SECRET: ${PROV_JWT_SECRET:-${FLEET_JWT_SECRET:-}}
      PROV_CSRF_SECRET: ${PROV_CSRF_SECRET:-${FLEET_CSRF_SECRET:-}}
      PROV_CA_PASSPHRASE: ${PROV_CA_PASSPHRASE:-${FLEET_CA_PASSPHRASE:-}}
      PROV_VAULT_PASSPHRASE: ${PROV_VAULT_PASSPHRASE:-${FLEET_VAULT_PASSPHRASE:-}}
      PROV_BACKUP_PASSPHRASE: ${PROV_BACKUP_PASSPHRASE:-${FLEET_BACKUP_PASSPHRASE:-}}
      # Audit-log integrity HMAC key. REQUIRED outside development (the backend
      # refuses to start without it): keys the tamper-evident audit chain, held
      # outside the DB so DB write access alone can't forge it. `openssl rand -hex 32`.
      PROV_AUDIT_HMAC_KEY: ${PROV_AUDIT_HMAC_KEY:-${FLEET_AUDIT_HMAC_KEY:-}}
      # Encrypts session recordings at rest. Optional but STRONGLY recommended in
      # production (unset = recordings stored unencrypted; the backend warns). Must be
      # >=32 bytes if set. `openssl rand -hex 32`.
      PROV_RECORDING_KEY: ${PROV_RECORDING_KEY:-${FLEET_RECORDING_KEY:-}}
      # External KMS/HSM for master-key protection (optional; default local). See docs/kms.md.
      PROV_KMS_PROVIDER: ${PROV_KMS_PROVIDER:-${FLEET_KMS_PROVIDER:-local}}
      PROV_KMS_KEY_ID: ${PROV_KMS_KEY_ID:-${FLEET_KMS_KEY_ID:-}}
      PROV_KMS_VAULT_ADDR: ${PROV_KMS_VAULT_ADDR:-${FLEET_KMS_VAULT_ADDR:-}}
      PROV_KMS_VAULT_TOKEN: ${PROV_KMS_VAULT_TOKEN:-${FLEET_KMS_VAULT_TOKEN:-}}
      PROV_KMS_AWS_REGION: ${PROV_KMS_AWS_REGION:-${FLEET_KMS_AWS_REGION:-}}
      PROV_KMS_AWS_ACCESS_KEY_ID: ${PROV_KMS_AWS_ACCESS_KEY_ID:-${FLEET_KMS_AWS_ACCESS_KEY_ID:-}}
      PROV_KMS_AWS_SECRET_ACCESS_KEY: ${PROV_KMS_AWS_SECRET_ACCESS_KEY:-${FLEET_KMS_AWS_SECRET_ACCESS_KEY:-}}
      PROV_KMS_AWS_ENDPOINT: ${PROV_KMS_AWS_ENDPOINT:-${FLEET_KMS_AWS_ENDPOINT:-}}
      PROV_KMS_AZURE_VAULT_URL: ${PROV_KMS_AZURE_VAULT_URL:-${FLEET_KMS_AZURE_VAULT_URL:-}}
      PROV_KMS_AZURE_TENANT_ID: ${PROV_KMS_AZURE_TENANT_ID:-${FLEET_KMS_AZURE_TENANT_ID:-}}
      PROV_KMS_AZURE_CLIENT_ID: ${PROV_KMS_AZURE_CLIENT_ID:-${FLEET_KMS_AZURE_CLIENT_ID:-}}
      PROV_KMS_AZURE_CLIENT_SECRET: ${PROV_KMS_AZURE_CLIENT_SECRET:-${FLEET_KMS_AZURE_CLIENT_SECRET:-}}
      PROV_KMS_GCP_CREDENTIALS_FILE: ${PROV_KMS_GCP_CREDENTIALS_FILE:-${FLEET_KMS_GCP_CREDENTIALS_FILE:-}}
      PROV_CA_PASSPHRASE_WRAPPED: ${PROV_CA_PASSPHRASE_WRAPPED:-${FLEET_CA_PASSPHRASE_WRAPPED:-}}
      PROV_VAULT_PASSPHRASE_WRAPPED: ${PROV_VAULT_PASSPHRASE_WRAPPED:-${FLEET_VAULT_PASSPHRASE_WRAPPED:-}}
      # External secrets manager (vault-of-record; optional). See docs/external-secrets.md.
      PROV_EXTSECRET_VAULT_ADDR: ${PROV_EXTSECRET_VAULT_ADDR:-${FLEET_EXTSECRET_VAULT_ADDR:-}}
      PROV_EXTSECRET_VAULT_TOKEN: ${PROV_EXTSECRET_VAULT_TOKEN:-${FLEET_EXTSECRET_VAULT_TOKEN:-}}
      PROV_EXTSECRET_VAULT_CACERT: ${PROV_EXTSECRET_VAULT_CACERT:-${FLEET_EXTSECRET_VAULT_CACERT:-}}
      PROV_EXTSECRET_VAULT_SKIP_VERIFY: ${PROV_EXTSECRET_VAULT_SKIP_VERIFY:-${FLEET_EXTSECRET_VAULT_SKIP_VERIFY:-}}
      PROV_EXTSECRET_AWS_REGION: ${PROV_EXTSECRET_AWS_REGION:-${FLEET_EXTSECRET_AWS_REGION:-}}
      PROV_EXTSECRET_AWS_ACCESS_KEY_ID: ${PROV_EXTSECRET_AWS_ACCESS_KEY_ID:-${FLEET_EXTSECRET_AWS_ACCESS_KEY_ID:-}}
      PROV_EXTSECRET_AWS_SECRET_ACCESS_KEY: ${PROV_EXTSECRET_AWS_SECRET_ACCESS_KEY:-${FLEET_EXTSECRET_AWS_SECRET_ACCESS_KEY:-}}
      PROV_EXTSECRET_AWS_SESSION_TOKEN: ${PROV_EXTSECRET_AWS_SESSION_TOKEN:-${FLEET_EXTSECRET_AWS_SESSION_TOKEN:-}}
      PROV_EXTSECRET_AWS_ENDPOINT: ${PROV_EXTSECRET_AWS_ENDPOINT:-${FLEET_EXTSECRET_AWS_ENDPOINT:-}}
      # Multi-site federation (optional; default standalone). See docs/federation.md.
      PROV_MODE: ${PROV_MODE:-${FLEET_MODE:-standalone}}
      PROV_HUB_URL: ${PROV_HUB_URL:-${FLEET_HUB_URL:-}}
      PROV_HUB_JOIN_TOKEN: ${PROV_HUB_JOIN_TOKEN:-${FLEET_HUB_JOIN_TOKEN:-}}
      PROV_HUB_KEY_FINGERPRINT: ${PROV_HUB_KEY_FINGERPRINT:-${FLEET_HUB_KEY_FINGERPRINT:-}}
      PROV_FEDERATION_TRANSPORT: ${PROV_FEDERATION_TRANSPORT:-${FLEET_FEDERATION_TRANSPORT:-}}
      PROV_COOKIE_SECURE: ${PROV_COOKIE_SECURE:-${FLEET_COOKIE_SECURE:-false}}
      PROV_JUMP_HOST: ${PROV_JUMP_HOST:-${FLEET_JUMP_HOST:-jumphost:22}}
      PROV_JUMP_USER: ${PROV_JUMP_USER:-${FLEET_JUMP_USER:-prov}}
      PROV_JUMP_KNOWN_HOSTS: ${PROV_JUMP_KNOWN_HOSTS:-${FLEET_JUMP_KNOWN_HOSTS:-}}
      PROV_SSH_INSECURE_HOST_KEYS: ${PROV_SSH_INSECURE_HOST_KEYS:-${FLEET_SSH_INSECURE_HOST_KEYS:-}}
      PROV_TRUSTED_PROXIES: ${PROV_TRUSTED_PROXIES:-${FLEET_TRUSTED_PROXIES:-}}
      # How many reverse proxies sit in front of this server. The client is the
      # X-Forwarded-For entry that many places from the right, so a caller cannot
      # reach it by prepending entries of its own. Deployments that terminate TLS
      # on a separate box in front of the SPA nginx have two, not one.
      PROV_TRUSTED_PROXY_HOPS: ${PROV_TRUSTED_PROXY_HOPS:-${FLEET_TRUSTED_PROXY_HOPS:-1}}
      PROV_CONTROL_PLANE_HOSTS: ${PROV_CONTROL_PLANE_HOSTS:-${FLEET_CONTROL_PLANE_HOSTS:-}}
      PROV_REENCRYPT_SECRETS: ${PROV_REENCRYPT_SECRETS:-${FLEET_REENCRYPT_SECRETS:-}}
      PROV_HOST_SCOPED_ONLY: ${PROV_HOST_SCOPED_ONLY:-${FLEET_HOST_SCOPED_ONLY:-}}
      # Multi-tenancy (MSP mode). Off = byte-for-byte single-tenant. When enabled,
      # the app DB role MUST be non-superuser (and lack BYPASSRLS) or row-level
      # isolation is silently ineffective — Postgres superusers bypass RLS.
      PROV_MULTI_TENANCY: ${PROV_MULTI_TENANCY:-${FLEET_MULTI_TENANCY:-false}}
      PROV_RDP_COLLECT_FACTS: ${PROV_RDP_COLLECT_FACTS:-${FLEET_RDP_COLLECT_FACTS:-}}
      PROV_RDP_WINRM_PORTS: ${PROV_RDP_WINRM_PORTS:-${FLEET_RDP_WINRM_PORTS:-}}
      PROV_RECORDING_DIR: /var/lib/prov/recordings
      PROV_ACTIVITY_RETENTION: ${PROV_ACTIVITY_RETENTION:-${FLEET_ACTIVITY_RETENTION:-}}
      PROV_AUDIT_RETENTION: ${PROV_AUDIT_RETENTION:-${FLEET_AUDIT_RETENTION:-}}
      PROV_MONITOR_CONCURRENCY: ${PROV_MONITOR_CONCURRENCY:-${FLEET_MONITOR_CONCURRENCY:-}}
      PROV_SCAN_DIR: /var/lib/prov/scans
      PROV_SCAN_TIMEOUT: ${PROV_SCAN_TIMEOUT:-${FLEET_SCAN_TIMEOUT:-60m}}
      PROV_PLAYBOOK_TIMEOUT: ${PROV_PLAYBOOK_TIMEOUT:-${FLEET_PLAYBOOK_TIMEOUT:-30m}}
      PROV_VAULT_ROTATION_CHECK: ${PROV_VAULT_ROTATION_CHECK:-${FLEET_VAULT_ROTATION_CHECK:-30m}}
      PROV_SCAP_CONTENT_DIR: /var/lib/prov/scap-content
      PROV_SCAP_CONTENT_VERSION: ${PROV_SCAP_CONTENT_VERSION:-${FLEET_SCAP_CONTENT_VERSION:-}}
      PROV_ANSIBLE_RUNNER_URL: ${PROV_ANSIBLE_RUNNER_URL:-${FLEET_ANSIBLE_RUNNER_URL:-http://ansible-runner:8000}}
      # Shared secret the backend sends (X-Runner-Token) to the ansible-runner sidecar.
      # REQUIRED outside development (the backend refuses to start without it): without
      # it, anything on the internal network could submit playbooks (RCE). The runner
      # sidecar reads the SAME value below. `openssl rand -hex 32`.
      PROV_ANSIBLE_RUNNER_TOKEN: ${PROV_ANSIBLE_RUNNER_TOKEN:-${FLEET_ANSIBLE_RUNNER_TOKEN:-}}
      PROV_GRYPE_SCANNER_URL: ${PROV_GRYPE_SCANNER_URL:-${FLEET_GRYPE_SCANNER_URL:-http://grype-scanner:8000}}
      # Image building (docs/imaging.md). Empty by default and the whole build
      # path is simply absent: the sidecar needs the Docker socket and a lot of
      # disk, and a fleet that consumes images somebody else builds should not
      # have to run it. Bring it up with `--profile imaging` and set both.
      PROV_BUILDER_RUNNER_URL: ${PROV_BUILDER_RUNNER_URL:-${FLEET_BUILDER_RUNNER_URL:-}}
      # Shared secret the backend sends (X-Runner-Token) to the builder runner.
      # The runner can start PRIVILEGED containers, so anything on the internal
      # network that can reach it unauthenticated is root on the host. Required
      # outside development whenever a runner URL is set. `openssl rand -hex 32`.
      PROV_BUILDER_RUNNER_TOKEN: ${PROV_BUILDER_RUNNER_TOKEN:-${FLEET_BUILDER_RUNNER_TOKEN:-}}
      # Where built images and bundles live, and the address machines in the
      # FIELD reach this server on -- routinely not the address an operator's
      # browser uses. See docs/imaging.md.
      PROV_ARTIFACT_DIR: ${PROV_ARTIFACT_DIR:-${FLEET_ARTIFACT_DIR:-/output}}
      PROV_CONTROL_URL: ${PROV_CONTROL_URL:-${FLEET_CONTROL_URL:-}}
      # How often a machine's agent checks in. Sent in every reply, so changing
      # it re-paces the whole fleet without touching a machine.
      PROV_AGENT_INTERVAL: ${PROV_AGENT_INTERVAL:-${FLEET_AGENT_INTERVAL:-300}}
      # Optional shared secret an agent must present to check in. Off by
      # default: the first heartbeat arrives from a machine that has just been
      # imaged and holds no credential. Set it when the control plane is
      # reachable from a network that is not the provisioning one -- and set the
      # SAME value in each machine's /etc/flipside/agent.conf, or they are
      # rejected and simply stop reporting.
      PROV_AGENT_TOKEN: ${PROV_AGENT_TOKEN:-${FLEET_AGENT_TOKEN:-}}
      # Whether machines a live rollout is waiting on are asked to check in now
      # rather than on their own timer. Off, rollouts still work, only slower.
      PROV_IMAGING_NUDGE: ${PROV_IMAGING_NUDGE:-${FLEET_IMAGING_NUDGE:-true}}
      PROV_MAX_UPLOAD_BYTES: ${PROV_MAX_UPLOAD_BYTES:-${FLEET_MAX_UPLOAD_BYTES:-5368709120}}
      # WireGuard overlay — managed-host enrollment uses these. Empty falls back
      # to the binary's defaults (see .env.example). PROV_WG_JUMP_ENDPOINT MUST
      # be set to a public/LAN address managed hosts can dial; PROV_WG_INTERFACE
      # lets you avoid colliding with an existing wg0 on managed hosts.
      PROV_WG_INTERFACE: ${PROV_WG_INTERFACE:-${FLEET_WG_INTERFACE:-}}
      PROV_WG_SUBNET: ${PROV_WG_SUBNET:-${FLEET_WG_SUBNET:-}}
      PROV_WG_JUMP_IP: ${PROV_WG_JUMP_IP:-${FLEET_WG_JUMP_IP:-}}
      PROV_WG_JUMP_ENDPOINT: ${PROV_WG_JUMP_ENDPOINT:-${FLEET_WG_JUMP_ENDPOINT:-}}
      PROV_WG_PORT: ${PROV_WG_PORT:-${FLEET_WG_PORT:-}}
      # OpenVPN overlay (the certificate/FIPS transport). It has its OWN subnet:
      # both overlays terminate on the same jump host, and one shared subnet gives
      # that host two routes for the same prefix. Empty falls back to the binary's
      # defaults (10.101.0.0/24, or the WireGuard subnet on an OpenVPN-only install).
      PROV_OVPN_SUBNET: ${PROV_OVPN_SUBNET:-${FLEET_OVPN_SUBNET:-}}
      PROV_OVPN_JUMP_IP: ${PROV_OVPN_JUMP_IP:-${FLEET_OVPN_JUMP_IP:-}}
      PROV_OVPN_PORT: ${PROV_OVPN_PORT:-${FLEET_OVPN_PORT:-}}
      # Sessions, tokens, certificate lifetimes.
      PROV_ACCESS_TOKEN_TTL: ${PROV_ACCESS_TOKEN_TTL:-${FLEET_ACCESS_TOKEN_TTL:-}}
      PROV_REFRESH_TOKEN_TTL: ${PROV_REFRESH_TOKEN_TTL:-${FLEET_REFRESH_TOKEN_TTL:-}}
      PROV_SESSION_IDLE_TTL: ${PROV_SESSION_IDLE_TTL:-${FLEET_SESSION_IDLE_TTL:-}}
      PROV_SESSION_ABSOLUTE_TTL: ${PROV_SESSION_ABSOLUTE_TTL:-${FLEET_SESSION_ABSOLUTE_TTL:-}}
      PROV_USER_CERT_TTL: ${PROV_USER_CERT_TTL:-${FLEET_USER_CERT_TTL:-}}
      PROV_CERT_RENEW_BEFORE: ${PROV_CERT_RENEW_BEFORE:-${FLEET_CERT_RENEW_BEFORE:-}}
      PROV_HOST_CERT_TTL: ${PROV_HOST_CERT_TTL:-${FLEET_HOST_CERT_TTL:-}}
      PROV_COOKIE_DOMAIN: ${PROV_COOKIE_DOMAIN:-${FLEET_COOKIE_DOMAIN:-}}
      # Per-IP rate limiting.
      PROV_RATE_LIMIT_PER_MIN: ${PROV_RATE_LIMIT_PER_MIN:-${FLEET_RATE_LIMIT_PER_MIN:-}}
      PROV_RATE_LIMIT_BURST: ${PROV_RATE_LIMIT_BURST:-${FLEET_RATE_LIMIT_BURST:-}}
      PROV_AUTH_RATE_LIMIT_PER_MIN: ${PROV_AUTH_RATE_LIMIT_PER_MIN:-${FLEET_AUTH_RATE_LIMIT_PER_MIN:-}}
      PROV_AUTH_RATE_LIMIT_BURST: ${PROV_AUTH_RATE_LIMIT_BURST:-${FLEET_AUTH_RATE_LIMIT_BURST:-}}
      # Bootstrap, MFA/WebAuthn (RPID/origins derive from PUBLIC_URL if empty).
      PROV_ALLOW_BOOTSTRAP: ${PROV_ALLOW_BOOTSTRAP:-${FLEET_ALLOW_BOOTSTRAP:-}}
      PROV_WEBAUTHN_RPID: ${PROV_WEBAUTHN_RPID:-${FLEET_WEBAUTHN_RPID:-}}
      PROV_WEBAUTHN_RP_NAME: ${PROV_WEBAUTHN_RP_NAME:-${FLEET_WEBAUTHN_RP_NAME:-}}
      PROV_WEBAUTHN_ORIGINS: ${PROV_WEBAUTHN_ORIGINS:-${FLEET_WEBAUTHN_ORIGINS:-}}
      # Observability / DB pool.
      PROV_LOG_LEVEL: ${PROV_LOG_LEVEL:-${FLEET_LOG_LEVEL:-}}
      PROV_LOG_FORMAT: ${PROV_LOG_FORMAT:-${FLEET_LOG_FORMAT:-}}
      PROV_TRACING: ${PROV_TRACING:-${FLEET_TRACING:-}}
      PROV_OTLP_ENDPOINT: ${PROV_OTLP_ENDPOINT:-${FLEET_OTLP_ENDPOINT:-}}
      PROV_DB_MAX_CONNS: ${PROV_DB_MAX_CONNS:-${FLEET_DB_MAX_CONNS:-}}
      PROV_DB_MIN_CONNS: ${PROV_DB_MIN_CONNS:-${FLEET_DB_MIN_CONNS:-}}
      # In-UI upgrade system: trusted release key(s), the updater sidecar address, a
      # shared secret only the backend knows, and the staging dir on the shared volume.
      PROV_RELEASE_TRUST_KEYS: ${PROV_RELEASE_TRUST_KEYS:-${FLEET_RELEASE_TRUST_KEYS:-}}
      PROV_UPDATER_URL: ${PROV_UPDATER_URL:-${FLEET_UPDATER_URL:-http://prov-updater:9000}}
      PROV_UPDATER_TOKEN: ${PROV_UPDATER_TOKEN:-${FLEET_UPDATER_TOKEN:-}}
      PROV_UPDATES_DIR: /var/lib/prov/updates
      # Optional signed release-channel index for the "check for updates" button.
      PROV_UPDATE_CHANNEL_URL: ${PROV_UPDATE_CHANNEL_URL:-${FLEET_UPDATE_CHANNEL_URL:-}}
    volumes:
      - headlamp-clusters:/headlamp/clusters
      - recordings:/var/lib/prov/recordings
      - scans:/var/lib/prov/scans
      - scap-content:/var/lib/prov/scap-content
      - backups:/var/lib/prov/backups
      - rdp-drive:/var/lib/prov/rdp-drive
      - updates:/var/lib/prov/updates
      # The artefact library: built images and signed update bundles.
      #
      # A host bind, not a named volume, and the SAME directory the builder
      # runner writes to. The runner starts sibling containers through the
      # Docker socket, so their mounts resolve against the host filesystem --
      # it necessarily writes to <project>/output there. A named volume here
      # would give the backend a private empty directory and the two halves
      # would never see each other's artefacts: every build would appear to
      # succeed and the library would stay empty.
      - ../../output:/output
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The alpine runtime ships busybox wget; hit the unauthenticated /health probe.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      # Bound to loopback: the frontend nginx reaches the backend over the internal
      # `prov` network (proxy_pass http://backend:8080), so the published port is
      # only for local debugging. This keeps the unauthenticated /metrics, /health,
      # and /ready endpoints off any public interface. Front the API through nginx
      # (set PROV_PUBLIC_URL to your domain) rather than exposing 8080 directly.
      - "127.0.0.1:8080:8080"
    networks: [prov]

  frontend:
    build:
      # Context is the repo root (not frontend/) so the image build can reach
      # docs/, which the in-app help bundle is generated from at build time.
      context: ../..
      dockerfile: frontend/Dockerfile
    image: provenance-frontend
    restart: unless-stopped
    environment:
      # Resolved per request, so a stack without the kubernetes profile still boots.
      HEADLAMP_HOST: ${HEADLAMP_HOST:-headlamp:4466}
      # The Aldgate log collector's Dashboards, proxied at /aldgate/. Points at
      # a nonexistent name by default so a deployment without a collector gets a
      # 502 on that one path instead of an nginx that will not boot.
      ALDGATE_HOST: ${ALDGATE_HOST:-aldgate.invalid:5601}
      DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
      VITE_API_BASE: ${PROV_PUBLIC_URL:-${FLEET_PUBLIC_URL:-http://localhost:8080}}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    ports:
      - "5173:80"
    networks: [prov]

  # Sidecar that validates/lints (and, later, runs) Ansible playbooks for the
  # backend. Internal-only: not published on the host, reachable on the fleet
  # network at http://ansible-runner:8000.
  ansible-runner:
    build:
      context: ../ansible-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Must match the backend's PROV_ANSIBLE_RUNNER_TOKEN; the runner rejects any
      # execute/check request whose X-Runner-Token doesn't match.
      PROV_ANSIBLE_RUNNER_TOKEN: ${PROV_ANSIBLE_RUNNER_TOKEN:-${FLEET_ANSIBLE_RUNNER_TOKEN:-}}
      # Ansible connection/become-prompt timeout (seconds). The runner defaults to 30
      # so a momentary overlay blip (TCP retransmission backoff) can't fail a host.
      PROV_ANSIBLE_TIMEOUT: ${PROV_ANSIBLE_TIMEOUT:-${FLEET_ANSIBLE_TIMEOUT:-30}}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks: [prov]

  # The Docker socket, behind an allowlist.
  #
  # It passes the calls this project actually makes and refuses the rest: exec
  # into another container, an arbitrary image, a host bind mount outside the
  # project. Both directions of getting this wrong are quiet -- too tight and a
  # build fails with a 403 and no clue which call; too loose and the socket is
  # still a socket, and the proxy is decoration -- so both are covered by
  # scripts/imaging/test-docker-proxy.sh against a real daemon.
  dockerproxy:
    profiles: [imaging]
    build:
      context: ../dockerproxy
    image: provenance-dockerproxy
    restart: unless-stopped
    environment:
      # Where the project lives on the host, which bounds what may be
      # bind-mounted into a build. Empty is discovered from the runner's own
      # /project mount, so the two cannot disagree.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
      # Whose /project mount to read the host path from. Must match the builder
      # runner's container_name.
      PROJECT_CONTAINER: provenance-builder-runner
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
      # Cross-architecture builds (an arm64 image on an amd64 host) need a qemu
      # interpreter registered with binfmt_misc. Off by default: registering it
      # means running a THIRD-PARTY image as host root, and everything else this
      # proxy permits is built from this repository.
      #
      # Prefer registering the interpreters on the host instead — it persists
      # across reboots, which this does not, and needs no exception here:
      #     sudo apt install qemu-user-static binfmt-support
      #
      # Set BINFMT_ALLOW=1 to let each build do it instead. Pin BINFMT_IMAGE to a
      # digest if you do.
      BINFMT_ALLOW: ${BINFMT_ALLOW:-}
      BINFMT_IMAGE: ${BINFMT_IMAGE:-tonistiigi/binfmt}
    volumes:
      # Not :ro. A read-only bind of a unix socket restricts nothing about what
      # can be done through it -- the confinement is the allowlist, and
      # pretending otherwise would be decoration.
      - /var/run/docker.sock:/var/run/docker.sock
      - dockerproxy:/shared
    # It connects to one socket and listens on another. Nothing else.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks: [prov]

  # Sidecar that builds OS images and update bundles, and drives the PXE
  # provisioning stack. Internal only, reachable at http://builder-runner:8000.
  #
  # Opt-in (`docker compose --profile imaging up`) for two reasons that are both
  # about not making every deployment pay for this one: it needs the Docker
  # socket, and a full image build wants tens of gigabytes of disk.
  #
  # It holds the Docker socket so the BACKEND does not. Building an image means
  # running a privileged container that loop-mounts a disk, and a process that
  # can ask for that can ask for anything -- so the ability is kept in a
  # container that does nothing else, rather than in the one that also holds the
  # SSH certificate authority.
  builder-runner:
    profiles: [imaging]
    build:
      context: ../builder-runner
      dockerfile: Dockerfile
    image: provenance-builder-runner
    # A fixed name so dockerproxy can inspect this container's /project mount and
    # learn where the project lives on the host. Compose's generated name carries
    # the project prefix and a replica index; the proxy needs one stable string.
    container_name: provenance-builder-runner
    restart: unless-stopped
    environment:
      # Must match the backend's PROV_BUILDER_RUNNER_TOKEN.
      PROV_BUILDER_RUNNER_TOKEN: ${PROV_BUILDER_RUNNER_TOKEN:-${FLEET_BUILDER_RUNNER_TOKEN:-}}
      # The address machines in the field reach the control plane on. The
      # provisioning stack is rendered with it, so it has to be known here too.
      CONTROL_URL: ${PROV_CONTROL_URL:-${FLEET_CONTROL_URL:-}}
      # Absolute path to the project ON THE HOST. Sibling containers are started
      # through the Docker socket, so the daemon resolves their bind mounts
      # against the host filesystem, not this container's. Left empty it is
      # detected from this container's own /project mount, which is always right.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
      # Set to unix:///var/run/docker.sock (and mount it) only if the allowlist
      # ever refuses something a build legitimately needs.
      DOCKER_HOST: ${DOCKER_HOST:-unix:///shared/docker.sock}
      # The same value the socket proxy is given. The runner runs this image and
      # the proxy decides whether it may; if the two disagree the build is refused
      # with a message naming an image nobody configured.
      BINFMT_IMAGE: ${BINFMT_IMAGE:-tonistiigi/binfmt}
    # The runner does not hold the raw socket either. It talks to dockerproxy,
    # which passes an allowlist of the calls a build actually makes and refuses
    # the rest. Two layers, because the runner runs shell that interpolates
    # build options, and "the options came from an authenticated operator" is
    # the reasoning behind most command injections.
    depends_on: [dockerproxy]
    volumes:
      # The proxied socket, not /var/run/docker.sock. See the note above.
      - dockerproxy:/shared
      # The project, for the builder context, overlay.d, and output/.
      - ../..:/project
      # The HOST's binfmt_misc registrations, read-only, so a cross-architecture
      # build can tell whether the qemu interpreter it needs is already there.
      #
      # It has to be the host's: this container has its own /proc, where
      # /proc/sys/fs/binfmt_misc is empty no matter what the host has registered.
      # Reading that instead would conclude "not registered" on a host where
      # `apt install qemu-user-static` had already made the build work, and refuse
      # to run it.
      #
      # Read-only — the container reads what is registered and cannot register
      # anything, which is the whole point of the check.
      - /proc/sys/fs/binfmt_misc:/host/binfmt_misc:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.1"
          memory: 128M
    networks: [prov]

  # Sidecar that runs Anchore Grype vulnerability scans for the backend. Internal
  # only, reachable at http://grype-scanner:8000. The vulnerability database is
  # fetched at runtime (online update or offline import) and persisted in the
  # grype-db volume — it is not baked into the image.
  grype-scanner:
    build:
      context: ../grype-scanner
      dockerfile: Dockerfile
    image: provenance-grype-scanner
    restart: unless-stopped
    environment:
      # How many grype scans run concurrently. grype is CPU/memory-heavy (it loads
      # the vuln DB per run), so a fleet-wide scan is bounded here rather than
      # serialized. Raise on a beefier host; keep low (1–2) on a small box.
      GRYPE_SCAN_CONCURRENCY: ${GRYPE_SCAN_CONCURRENCY:-2}
      # Per-scan wall-clock cap (seconds) before the scanner returns 504 "scan timed
      # out". Must be >= the time grype needs on your LARGEST host: a host with a big
      # package database (e.g. an ML/CUDA box with thousands of dpkg entries) can take
      # several minutes. Default 20m to match the backend's PROV_VULN_SCAN_TIMEOUT so
      # the scanner never gives up before the backend would. Raise if a host still 504s.
      GRYPE_SCAN_TIMEOUT: ${GRYPE_SCAN_TIMEOUT:-1200}
      # Wall-clock cap (seconds) for a grype DB update/import (the ~1 GB vuln DB).
      GRYPE_DB_TIMEOUT: ${GRYPE_DB_TIMEOUT:-900}
    volumes:
      - grype-db:/home/scanner/.cache/grype
    deploy:
      resources:
        # grype loads the full ~1 GB vuln DB per scan and is CPU/memory-heavy; cap it
        # so a fleet-wide scan can't starve the backend. Raise on a beefier host.
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 128M
    networks: [prov]

  # Privileged upgrade sidecar (in-UI upgrade system). It holds the Docker socket so
  # it can swap the app images when an operator applies a signed .provup bundle. It
  # independently re-verifies every bundle's signature, so it never trusts the
  # backend. Not published on any host port — reachable only on the internal network.
  # OMIT this service if you don't want in-UI upgrades (the Docker socket is a
  # host-root-equivalent grant); upgrades then remain a `make redeploy-single` step.
  prov-updater:
    build:
      context: ../../backend
      dockerfile: Dockerfile.updater
    image: provenance-prov-updater
    restart: unless-stopped
    environment:
      PROV_UPDATER_TOKEN: ${PROV_UPDATER_TOKEN:-${FLEET_UPDATER_TOKEN:-}}
      PROV_RELEASE_TRUST_KEYS: ${PROV_RELEASE_TRUST_KEYS:-${FLEET_RELEASE_TRUST_KEYS:-}}
      PROV_UPDATES_DIR: /var/lib/prov/updates
      PROV_UPDATER_PROJECT: provenance
      PROV_UPDATER_COMPOSE_FILES: /compose/docker-compose.yml:/compose/docker-compose.jumphost.yml
      # The root .env is mounted at its OWN path (not inside the read-only /compose
      # mount — you can't create a mount target file inside a read-only bind mount).
      PROV_UPDATER_ENV_FILE: /prov.env
      PROV_UPDATER_BACKEND_URL: http://backend:8080
    volumes:
      # The Docker socket is what makes this component privileged — it is the whole
      # reason the backend delegates the container swap here instead of doing it itself.
      - /var/run/docker.sock:/var/run/docker.sock
      - updates:/var/lib/prov/updates
      # The compose project files + root .env, so the updater runs compose against the
      # same project. Read-only; build contexts are unused (the updater passes --no-build).
      - ../compose:/compose:ro
      # Writable: the updater merges additive config keys (and generated secrets like
      # PROV_UPDATER_TOKEN) declared in a signed bundle's manifest into .env before it
      # recreates containers. Strictly additive — operator-set values are never touched.
      - ../../.env:/prov.env:rw
    networks: [prov]

  # Apache Guacamole daemon: brokers RDP (and VNC) desktop sessions for the
  # backend. Internal only, reachable at guacd:4822. The backend tunnels the
  # target's RDP port to guacd through the jump host, so guacd only ever connects
  # back to the backend — it needs no direct route to managed hosts.
  #
  # guacd writes RDP session recordings into the shared `recordings` volume (under
  # /var/lib/prov/recordings/rdp), which the backend serves back for replay, and
  # per-session redirected-drive files into the `rdp-drive` volume (for RDP file
  # transfer, cleaned up by the backend when the session ends). It runs as the
  # backend's `prov` user (uid 100 / gid 101 from the backend image) so the backend
  # can read/remove the files guacd creates on those shared volumes.
  guacd:
    image: guacamole/guacd:1.5.5
    user: "100:101"
    # Running as an arbitrary uid leaves HOME as "/" (not writable), which breaks
    # FreeRDP's TLS/NLA setup ("home directory is not writable" → security negotiation
    # failures). Point HOME at a writable dir so FreeRDP can store its config/certs.
    environment:
      HOME: /tmp
    restart: unless-stopped
    volumes:
      - recordings:/var/lib/prov/recordings
      - rdp-drive:/var/lib/prov/rdp-drive
    networks: [prov]

  # Headlamp renders the Kubernetes UI; Provenance owns identity, the credential
  # and the audit trail.
  #
  # It is deliberately NOT given a kubeconfig containing a token. A kubeconfig
  # carries ONE credential, so a shared one would make every operator reach
  # Provenance as the same identity and collapse the audit log to a single
  # actor -- which is the whole reason to embed a UI rather than link out to one.
  # Instead each operator supplies their own token, minted by
  # POST /api/v1/k8s/kubeconfig and scoped so it can reach nothing in Provenance
  # but the Kubernetes broker.
  #
  # Opt-in: `docker compose --profile kubernetes up -d`. A deployment that has
  # joined no clusters should not run a Kubernetes UI.
  headlamp:
    image: ghcr.io/headlamp-k8s/headlamp:v0.43.0
    profiles: [kubernetes]
    restart: unless-stopped
    # -in-cluster is off: Headlamp is not running inside a cluster, and must not
    # pick up an ambient ServiceAccount. Every cluster it sees arrives through
    # Provenance's proxy or not at all.
    command:
      - "-plugins-dir=/headlamp/plugins"
      - "-base-url=/headlamp"
      - "-kubeconfig=/headlamp/clusters/kubeconfig"
      # Helm on the backend. NOTE: this does NOT put Helm in the console -- the
      # bundled web frontend ships no Helm section, and the backend's Helm
      # endpoints are gated behind an internal X-HEADLAMP_BACKEND-TOKEN that only
      # Headlamp's desktop build sends. Verified against v0.43.0: /helm/* answers
      # 403 "does not match HEADLAMP_BACKEND_TOKEN" from the browser, and the only
      # shipped plugin is prometheus.
      #
      # Left on so a later Headlamp that ships a Helm UI needs no redeploy. Such a
      # UI would need a cluster joined at `administer`, because Helm 3 keeps
      # release state in Secrets -- and Secrets require Kubernetes.Administer on
      # every brokered call, so this flag widens nobody's access by itself.
      - "-enable-helm"
    environment:
      # Headlamp serves under a sub-path so it can be embedded rather than
      # occupying its own hostname.
      HEADLAMP_CONFIG_BASE_URL: /headlamp
    volumes:
      # Written by the backend: the cluster NAMES and SERVER URLs, with no user
      # and no token. Headlamp cannot find a cluster it has never been told
      # about, so without this the console opens on "Something went wrong with
      # cluster <name>" -- which is what "give it no token" produced when it was
      # implemented as "give it no kubeconfig".
      - headlamp-clusters:/headlamp/clusters:ro
    networks: [prov]

volumes:
  headlamp-clusters:
  pgdata:
  recordings:
  scans:
  scap-content:
  backups:
  grype-db:
  rdp-drive:
  updates: # staged upgrade bundles, shared between backend and prov-updater
  dockerproxy: # the allowlisted socket the builder runner talks to

networks:
  prov:
    driver: bridge
